# Human-in-the-loop across BOTH engines.
#
# Reactory owns the approval experience; Temporal owns the money:
#   1. start the Temporal batch (fire-and-forget) — it screens, reserves funds and
#      then parks on its own `await condition(() => isApproved)`
#   2. Reactory reads the live Temporal state, raises an APPROVAL TASK for a user and
#      SUSPENDS until they action it in the UI
#   3. signal Temporal so its approval gate opens
#   4. durably await the final outcome
#
# Run it (CLI):
#   reactory workflow start reactory-temporal-examples.ApproveBatchPayout@1.0.0 \
#     --input='{"batchId":"2026_002"}'
#   reactory workflow get <instanceId>            # shows the step waiting for approval
#
# Approve it in the UI: the task appears in the user's queue (userWorkflowTasks),
# renders as core.WorkflowTaskApproval@1.0.0, and approving calls the
# completeWorkflowTask mutation — which publishes workflow.task.completed keyed on
# the task id and resumes this instance. To approve from the CLI instead:
#   reactory workflow continue <instanceId> \
#     --event=workflow.task.completed --event-key=<taskId> \
#     --event-data='{"approved":true,"approverId":"user_checker_werner"}'
#
# Requires: a Temporal cluster and a worker serving `b2b-payouts-queue`.
nameSpace: reactory-temporal-examples
name: ApproveBatchPayout
version: 1.0.0
description: Maker/checker payout — Reactory holds the approval gate, Temporal executes.
author: Reactory
tags: [temporal, approval, human-in-the-loop, example]
inputs:
  batchId:
    type: string
    required: true
  accountId:
    type: string
    required: false
    default: acc_acme_payroll_gbp
  currency:
    type: string
    required: false
    default: GBP
  approverEmail:
    type: string
    required: false
    description: >-
      Checker who must approve. Accepts a user id or an email address; when omitted
      the task falls to the user who started the workflow.
  rows:
    type: array
    required: false
    description: Payout rows. Defaults to a small sample so the workflow is runnable as-is.
    default:
      - rowId: "1"
        beneficiaryName: Sarah Jenkins
        accountNumber: GB82WEST12345678901234
        amount: 3200
        currency: GBP
      - rowId: "2"
        beneficiaryName: Alex Thorne
        accountNumber: GB29NWBK60161331926819
        amount: 2850
        currency: GBP
steps:
  # 1. Start the Temporal execution and continue — it will park on its own gate.
  - id: startPayout
    name: Start Temporal batch
    type: temporal_workflow
    config:
      workflowType: B2BMassPayoutWorkflow
      workflowId: "batch_${input.batchId}"
      taskQueue: b2b-payouts-queue
      awaitMode: none
      args:
        - batchId: "${input.batchId}"
          accountId: "${input.accountId}"
          currency: "${input.currency}"
          rows: "${input.rows}"

  # 2. Read the batch's live state straight out of the running Temporal workflow —
  #    a Query, so it costs nothing and cannot affect the execution.
  - id: batchProgress
    name: Read Temporal batch progress
    type: temporal_query
    dependsOn: startPayout
    # A worker may not have picked the run up yet, and a Query against a run with no
    # poller fails. Step-level, not config: continueOnError is engine behaviour.
    continueOnError: true
    config:
      workflowId: "${steps.startPayout.outputs.workflowId}"
      queryType: getBatchProgress

  # 3. Reactory's own durable gate. This raises a Task for the checker — it shows up
  #    in their queue in the UI, rendered by the component named in `fqn` — and the
  #    instance suspends until they complete it. The wake-up is correlated by task id,
  #    so a named step and several concurrent tasks are all unambiguous.
  - id: awaitApproval
    name: Await checker approval
    type: user_activity
    dependsOn: batchProgress
    config:
      activityType: approval
      assignee: "${input.approverEmail}"
      message: "Approve payout batch ${input.batchId} — ${steps.batchProgress.outputs.result.totalAmount} ${input.currency}"
      fqn: core.WorkflowTaskApproval@1.0.0
      # Static props merged with values pulled from workflow state, so the approval
      # card shows the operator what they are actually approving.
      props:
        category: Mass payout
      propsMap:
        amount: steps.batchProgress.outputs.result.totalAmount
        currency: input.currency
        vendor: input.accountId

  # 4. Release Temporal's gate with the approver Reactory captured.
  - id: approveInTemporal
    name: Release the Temporal approval gate
    type: temporal_signal
    dependsOn: awaitApproval
    config:
      workflowId: "${steps.startPayout.outputs.workflowId}"
      signalName: approveBatch
      args:
        - "${steps.awaitApproval.outputs.completedBy}"

  # 5. Durably await settlement — again without holding a worker.
  - id: awaitSettlement
    name: Await settlement
    type: temporal_await
    dependsOn: approveInTemporal
    config:
      workflowId: "${steps.startPayout.outputs.workflowId}"
      awaitMode: event
      awaitTimeout: 86400000
      resultPath: totalSettled
      failOnWorkflowFailure: false

  - id: report
    name: Report settlement
    type: log
    dependsOn: awaitSettlement
    config:
      level: info
      message: "Batch ${input.batchId}: ${steps.awaitSettlement.outputs.status}, settled ${steps.awaitSettlement.outputs.result} payouts (approved by ${steps.awaitApproval.outputs.completedBy})"
