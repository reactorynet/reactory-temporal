enum TemporalWorkflowExecutionStatus {
  RUNNING
  COMPLETED
  FAILED
  CANCELED
  TERMINATED
  CONTINUED_AS_NEW
  TIMED_OUT
  UNKNOWN
}

type TemporalWorkflowExecution {
  workflowId: String!
  runId: String!
  workflowType: String
  taskQueue: String
  status: TemporalWorkflowExecutionStatus
  startTime: String
  closeTime: String
  historyLength: Int
}

input TemporalConnectionConfigInput {
  address: String
  namespace: String
  apiKey: String
}

input TemporalStartWorkflowInput {
  workflowType: String!
  workflowId: String!
  taskQueue: String!
  args: [Any]
  searchAttributes: Any
  memo: Any
  cronSchedule: String
  connectionConfig: TemporalConnectionConfigInput
}

input TemporalSignalWorkflowInput {
  workflowId: String!
  runId: String
  signalName: String!
  args: [Any]
  connectionConfig: TemporalConnectionConfigInput
}

input TemporalQueryWorkflowInput {
  workflowId: String!
  runId: String
  queryType: String!
  args: [Any]
  connectionConfig: TemporalConnectionConfigInput
}

type TemporalExecutionResult {
  workflowId: String!
  runId: String!
  status: String
}

extend type Query {
  """
  Queries the status and execution metadata of a Temporal workflow
  """
  temporalWorkflowStatus(workflowId: String!, runId: String, connectionConfig: TemporalConnectionConfigInput): TemporalWorkflowExecution

  """
  Executes a read-only query on an active or closed Temporal workflow
  """
  temporalQueryWorkflow(input: TemporalQueryWorkflowInput!): Any

  """
  Tests connection to the configured or default Temporal cluster
  """
  temporalPing(connectionConfig: TemporalConnectionConfigInput): Boolean!
}

extend type Mutation {
  """
  Starts a new durable workflow execution on Temporal
  """
  temporalStartWorkflow(input: TemporalStartWorkflowInput!): TemporalExecutionResult!

  """
  Sends an asynchronous signal to a running Temporal workflow
  """
  temporalSignalWorkflow(input: TemporalSignalWorkflowInput!): Boolean!

  """
  Requests cancellation of an active Temporal workflow
  """
  temporalCancelWorkflow(workflowId: String!, runId: String, connectionConfig: TemporalConnectionConfigInput): Boolean!

  """
  Terminates an active Temporal workflow immediately with a reason
  """
  temporalTerminateWorkflow(workflowId: String!, reason: String, runId: String, connectionConfig: TemporalConnectionConfigInput): Boolean!
}

# ─────────────────────────────────────────────────────────────────────────────────
# Completion watches — the bridge that wakes suspended Reactory workflow steps
# ─────────────────────────────────────────────────────────────────────────────────

enum TemporalWatchStatus {
  """Waiting for the Temporal execution to reach a terminal state."""
  pending
  """Terminal outcome recorded; delivery to the waiting step is in progress."""
  settled
  """The waiting step is confirmed to have consumed the event."""
  acked
  """The await deadline passed before the run settled."""
  timed_out
  """Delivery was retried to exhaustion and given up on."""
  abandoned
}

type TemporalWorkflowWatch {
  id: String!
  workflowId: String!
  runId: String
  eventName: String!
  eventKey: String!
  status: TemporalWatchStatus!
  """The Temporal status recorded when the watch settled."""
  outcomeStatus: String
  """The Reactory workflow instance waiting on this run."""
  instanceId: String
  stepId: String
  attempts: Int
  lastError: String
  awaitDeadline: String
  createdAt: String
  settledAt: String
  ackedAt: String
}

type TemporalSweepReport {
  reattached: Int!
  republished: Int!
  timedOut: Int!
  acked: Int!
  abandoned: Int!
}

input TemporalWatchFilter {
  status: TemporalWatchStatus
  workflowId: String
  instanceId: String
  limit: Int
}

extend type Query {
  """
  Outstanding Temporal completion watches for the current partner — which runs the
  workflow engine is still waiting on, and whether any delivery was abandoned.
  """
  temporalWorkflowWatches(filter: TemporalWatchFilter): [TemporalWorkflowWatch]
}

extend type Mutation {
  """
  Publish a Temporal event into the Reactory workflow engine, resuming any step
  suspended on (eventName, eventKey). eventName must begin with "temporal.".
  """
  temporalPublishWorkflowEvent(
    eventName: String
    eventKey: String!
    workflowId: String
    runId: String
    data: Any
  ): Boolean!

  """
  Run one bridge reconciliation pass immediately (re-attach, re-publish, time out,
  ack) instead of waiting for the background sweep. Intended for operators.
  """
  temporalSweepWatches: TemporalSweepReport!
}
